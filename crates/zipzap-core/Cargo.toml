[package]
name = "zipzap-core"
version = "0.1.0-beta.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.28.0", features = ["v4"] }
sha2 = "=0.11.1"
native-tls = "=0.2.18"
httpdate = "=1.0.3"
jiff = "=0.2.38"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
