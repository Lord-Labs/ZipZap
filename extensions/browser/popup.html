<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ZipZap</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon32.png" width="32" height="32" alt="" /><strong>ZipZap<span>.</span></strong>
    </header>
    <p data-i18n="description"></p>
    <form>
      <label for="url" data-i18n="link"></label
      ><input
        id="url"
        autocomplete="off"
        type="url"
        dir="ltr"
        placeholder="https://example.com/file.zip"
        required
        maxlength="16384"
      /><button type="submit" data-i18n="send"></button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="check-connection" type="button" data-i18n="checkConnection"></button>
    <p id="health" role="status" aria-live="polite"></p>
    <section aria-labelledby="capture-title">
      <h2 id="capture-title" data-i18n="captureTitle"></h2>
      <p data-i18n="captureHelp"></p>
      <bdi id="site-origin"></bdi>
      <button id="capture-toggle" type="button" disabled data-i18n="captureEnable"></button>
      <p id="capture-status" role="status" aria-live="polite"></p>
      <ul id="capture-sites" aria-label="Enabled sites"></ul>
      <button id="capture-clear" type="button" data-i18n="captureClear"></button>
    </section>
    <footer data-i18n="privacy"></footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
