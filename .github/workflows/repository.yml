name: Repository

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit
      - name: Verify repository
        run: npm run check
      - name: Build frontend and browser extension
        run: npm run build:web && npm run build:extension
      - name: Install browser test runtime
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Verify UI behavior and accessibility
        if: runner.os == 'Linux'
        run: npx playwright test
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, pinned 2026-10-16
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Reuse Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99.0-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: ${{ runner.os }}-rust-1.99.0-
      - name: Prepare Windows native sidecar
        if: runner.os == 'Windows'
        run: node scripts/build-native.mjs
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build Rust workspace
        run: cargo build --workspace --locked
      - name: Verify Rust against the local HTTP fixture
        run: node experiments/engine-strategy/compare.mjs
      - name: Verify download integrity and durable recovery
        run: node scripts/test-engine.mjs
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:build
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zipzapVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          npx playwright install chromium
          if($LASTEXITCODE -ne 0) { throw 'Cannot install browser test runtime' }
          ./scripts/test-installer.ps1 -Installer "target/release/bundle/nsis/ZipZap_${zipzapVersion}_x64-setup.exe" -UpgradeFromFirstBeta -BrowserChecks

  required:
    name: Repository checks
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform to pass
        shell: bash
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
