name: Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked tooling
        run: npm ci --ignore-scripts --no-audit
      - name: Verify repository
        run: npm run check
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, pinned 2026-10-16
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint the feasibility probe
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the feasibility probe
        run: cargo test --workspace --locked
      - name: Build the feasibility probe
        run: cargo build --workspace --locked
      - name: Verify Rust against the local HTTP fixture
        run: node experiments/engine-strategy/compare.mjs
      - name: Verify download integrity and durable recovery
        run: node scripts/test-engine.mjs

  required:
    name: Repository checks
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform to pass
        shell: bash
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
